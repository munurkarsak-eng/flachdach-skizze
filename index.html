<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;font-family:Arial,sans-serif;color:#202938}.app{max-width:820px;margin:auto;padding:8px}.card{background:#fff;border:1px solid #ccd2d8;border-radius:16px;padding:10px}h1{font-size:23px;margin:0 0 4px}.sub{font-size:14px;color:#5d6672;margin:0 0 9px}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.top input{width:80px;height:42px;font-size:19px;padding:6px}.wrap{border:2px solid #cbd1d7;border-radius:14px;overflow:hidden;background:#fff}canvas{display:block;width:100%;aspect-ratio:1.18/1;touch-action:none}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}button{min-height:42px;padding:8px 11px;font-size:15px}.status{min-height:22px;margin-top:8px;font-size:14px;color:#59636e}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0007;z-index:999;padding:16px}.modal.show{display:flex}.box{width:min(420px,100%);background:#fff;border-radius:16px;padding:17px}.box h2{margin:0 0 12px}.box input{width:100%;height:52px;font-size:24px;padding:8px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}.version{font-size:12px;font-weight:bold;background:#e8f1ff;padding:5px 8px;border-radius:8px}

<div class="app"><div class="card"><h1>Flachdach-Skizze</h1>
<p class="sub">Punkte setzen → P1 zum Schließen. Kante antippen = Maß · Eckpunkt ziehen = Form · freie Fläche ziehen = Ansicht.</p>
<div class="top"><label>Raster <input id="grid" inputmode="decimal" value="1"> m</label><span class="version">NEUAUFBAU 19.09.2026-G</span></div>
<div class="wrap"><canvas id="cv" width="1000" height="800"></canvas></div>
<div class="tools"><button id="undo">↶ Letzter Punkt</button><button id="clear">✕ Löschen</button><button id="zin">＋ Zoom</button><button id="zout">− Zoom</button><button id="fit">⊙ Winkel anpassen</button><button id="attikaBtn">▤ Attika</button><button id="objBtn">＋ Bauteile</button><button id="measureBtn">📏 Maßband</button></div>
<div id="status" class="status">P1 setzen.</div></div></div>
<div id="modal" class="modal"><div class="box"><h2 id="mtitle">Kante – Länge</h2><input id="mlen" inputmode="decimal" placeholder="z. B. 12,00"><div class="actions"><button id="cancel">Abbrechen</button><button id="save">Übernehmen</button></div></div></div>
<script>
(()=>{"use strict";
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),status=document.getElementById("status"),modal=document.getElementById("modal"),mlen=document.getElementById("mlen"),mtitle=document.getElementById("mtitle");
let pts=[],closed=false,measures=[],gesture=null,active=-1,view={s:1,ox:0,oy:0};const STEP=50;let attika={h:30,b:24};let objects=[];let placing=null,editObj=-1;let tape={on:false,base:-1,target:-1};const pointers=new Map();let pinch=null;
const num=v=>Number(String(v||"").replace(",",".")),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function screen(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
function world(e){const p=screen(e);return{x:(p.x-view.ox)/view.s,y:(p.y-view.oy)/view.s}}
function csspx(v){return v*cv.width/cv.getBoundingClientRect().width/view.s}
function snap(p){return{x:Math.round(p.x/STEP)*STEP,y:Math.round(p.y/STEP)*STEP}}
function E(i){const a=pts[i],b=pts[(i+1)%pts.length],dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1;return{a,b,L,ux:dx/L,uy:dy/L}}
function seg(p,a,b){const vx=b.x-a.x,vy=b.y-a.y,l=vx*vx+vy*vy||1;let t=((p.x-a.x)*vx+(p.y-a.y)*vy)/l;t=Math.max(0,Math.min(1,t));return{t,d:dist(p,{x:a.x+t*vx,y:a.y+t*vy})}}
function pointHit(p){let z=-1,b=csspx(24);pts.forEach((q,i)=>{const v=dist(p,q);if(v<b){b=v;z=i}});return z}
function edgeHit(p){if(!closed)return-1;let z=-1,b=csspx(30);pts.forEach((a,i)=>{const q=seg(p,a,pts[(i+1)%pts.length]);if(q.t>.1&&q.t<.9&&q.d<b){b=q.d;z=i}});return z}
function mpp(){const a=[];measures.forEach((m,i)=>{if(num(m)>0&&pts[i])a.push(num(m)/E(i).L)});if(a.length){a.sort((a,b)=>a-b);return a[Math.floor(a.length/2)]}const g=num(document.getElementById("grid").value);return(g>0?g:1)/STEP}
function mate(i){if(!closed||pts.length<4)return-1;const a=E(i);let best=-1,score=1e9;for(let j=0;j<pts.length;j++){if(j===i||j===(i+1)%pts.length||i===(j+1)%pts.length)continue;const b=E(j),par=Math.abs(a.ux*b.uy-a.uy*b.ux),rel=Math.abs(a.L-b.L)/Math.max(a.L,b.L);if(par>.055||rel>.04)continue;const s=par*10+rel;if(s<score){score=s;best=j}}return best}
function center(){return pts.reduce((a,p)=>({x:a.x+p.x/pts.length,y:a.y+p.y/pts.length}),{x:0,y:0})}
function angleAt(i){
 if(!closed||pts.length<3)return null;
 const a=pts[(i-1+pts.length)%pts.length],b=pts[i],c=pts[(i+1)%pts.length];
 const v1={x:a.x-b.x,y:a.y-b.y},v2={x:c.x-b.x,y:c.y-b.y};
 const l1=Math.hypot(v1.x,v1.y),l2=Math.hypot(v2.x,v2.y);if(!l1||!l2)return null;
 const small=Math.acos(Math.max(-1,Math.min(1,(v1.x*v2.x+v1.y*v2.y)/(l1*l2))))*180/Math.PI;
 let area=0;for(let k=0;k<pts.length;k++){const q=pts[k],r=pts[(k+1)%pts.length];area+=q.x*r.y-r.x*q.y}
 const cross=v1.x*v2.y-v1.y*v2.x;
 const reflex=(area>0&&cross>0)||(area<0&&cross<0);
 return reflex?360-small:small
}
function dirClass(i){
 const e=E(i),ax=Math.abs(e.ux),ay=Math.abs(e.uy);
 if(ax>.985)return{axis:"x",sign:Math.sign(e.ux)||1};
 if(ay>.985)return{axis:"y",sign:Math.sign(e.uy)||1};
 return null
}
function inferOrthogonalMeasures(){
 if(!closed)return;
 ["x","y"].forEach(axis=>{
  let known=0,unknown=[];
  for(let i=0;i<pts.length;i++){
   const d=dirClass(i);if(!d||d.axis!==axis)continue;
   const v=num(measures[i]);
   if(v>0)known+=d.sign*v;else unknown.push({i,sign:d.sign})
  }
  if(unknown.length===1){
   const u=unknown[0],v=-known/u.sign;
   if(v>0.0001)measures[u.i]=v.toFixed(2).replace(/\.00$/,"").replace(".",",")
  }
 })
}
function rebuildFromMeasures(anchor=0){
 if(!closed||pts.length<3)return;
 const scale=mpp();if(!(scale>0))return;
 const old=pts.map(q=>({...q})),next=[{...old[anchor]}];
 for(let step=0;step<pts.length-1;step++){
  const i=(anchor+step)%pts.length,a=old[i],b=old[(i+1)%pts.length];
  const dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,wanted=num(measures[i]);
  const len=wanted>0?wanted/scale:L,prev=next[next.length-1];
  next.push({x:prev.x+dx/L*len,y:prev.y+dy/L*len})
 }
 const rebuilt=Array(pts.length);
 for(let step=0;step<pts.length;step++)rebuilt[(anchor+step)%pts.length]=next[step];
 pts=rebuilt
}
function draw(){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);ctx.save();ctx.translate(view.ox,view.oy);ctx.scale(view.s,view.s);ctx.strokeStyle="#e6e8eb";ctx.lineWidth=1/view.s;for(let q=-2000;q<3000;q+=STEP){ctx.beginPath();ctx.moveTo(q,-2000);ctx.lineTo(q,3000);ctx.stroke();ctx.beginPath();ctx.moveTo(-2000,q);ctx.lineTo(3000,q);ctx.stroke()}if(pts.length>1){const n=closed?pts.length:pts.length-1;for(let i=0;i<n;i++){const e=E(i);ctx.strokeStyle=measures[i]?"#16823b":"#202938";ctx.lineWidth=measures[i]?7:5;ctx.beginPath();ctx.moveTo(e.a.x,e.a.y);ctx.lineTo(e.b.x,e.b.y);ctx.stroke()}}ctx.font="bold 18px Arial";pts.forEach((p,i)=>{ctx.fillStyle="#202938";ctx.beginPath();ctx.arc(p.x,p.y,8,0,Math.PI*2);ctx.fill();ctx.fillStyle="#111";ctx.fillText("P"+(i+1),p.x+12,p.y-12)});if(closed){const c=center();for(let i=0;i<pts.length;i++){const e=E(i),mx=(e.a.x+e.b.x)/2,my=(e.a.y+e.b.y)/2;let nx=-e.uy,ny=e.ux;if((mx+nx*30-c.x)**2+(my+ny*30-c.y)**2<(mx-nx*30-c.x)**2+(my-ny*30-c.y)**2){nx=-nx;ny=-ny}const off=45,ax=e.a.x+nx*off,ay=e.a.y+ny*off,bx=e.b.x+nx*off,by=e.b.y+ny*off;ctx.strokeStyle=measures[i]?"#16823b":"#374151";ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(e.a.x+nx*12,e.a.y+ny*12);ctx.lineTo(ax,ay);ctx.moveTo(e.b.x+nx*12,e.b.y+ny*12);ctx.lineTo(bx,by);ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.stroke();const ah=10,aw=5;function ar(x,y,dx,dy){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx*ah-dy*aw,y+dy*ah+dx*aw);ctx.lineTo(x+dx*ah+dy*aw,y+dy*ah-dx*aw);ctx.closePath();ctx.fill()}ar(ax,ay,e.ux,e.uy);ar(bx,by,-e.ux,-e.uy);const t="K"+(i+1)+(measures[i]?" · "+String(measures[i]).replace(".",",")+" m":"");ctx.font="bold 18px Arial";ctx.textAlign="center";ctx.textBaseline="middle";const tx=(ax+bx)/2+nx*15,ty=(ay+by)/2+ny*15,w=ctx.measureText(t).width+12;ctx.fillStyle="rgba(255,255,255,.94)";ctx.fillRect(tx-w/2,ty-12,w,24);ctx.fillStyle=measures[i]?"#16823b":"#374151";ctx.fillText(t,tx,ty);ctx.textAlign="start"}const cc=center();pts.forEach((p,i)=>{const ang=angleAt(i);if(ang==null)return;const prev=pts[(i-1+pts.length)%pts.length],next=pts[(i+1)%pts.length];let u={x:prev.x-p.x,y:prev.y-p.y},v={x:next.x-p.x,y:next.y-p.y},lu=Math.hypot(u.x,u.y)||1,lv=Math.hypot(v.x,v.y)||1;u.x/=lu;u.y/=lu;v.x/=lv;v.y/=lv;let bx=u.x+v.x,by=u.y+v.y,bl=Math.hypot(bx,by)||1;bx/=bl;by/=bl;if((p.x+bx*40-cc.x)**2+(p.y+by*40-cc.y)**2>(p.x-bx*40-cc.x)**2+(p.y-by*40-cc.y)**2){bx=-bx;by=-by}const r=28,a1=Math.atan2(u.y,u.x),a2=Math.atan2(v.y,v.x);let d=(a2-a1+Math.PI*2)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;const ok=geometryOK(i);ctx.strokeStyle=ok?"#16823b":"#c62828";ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(p.x,p.y,r,a1,a1+d,d<0);ctx.stroke();const text=(Math.abs(ang-Math.round(ang))<.05?Math.round(ang):ang.toFixed(1).replace(".",","))+"°";ctx.font="bold 20px Arial";ctx.textAlign="center";ctx.textBaseline="middle";const tx=p.x+bx*58,ty=p.y+by*58,w=ctx.measureText(text).width+12;ctx.fillStyle="rgba(255,255,255,.94)";ctx.fillRect(tx-w/2,ty-13,w,26);ctx.fillStyle=ok?"#16823b":"#c62828";ctx.fillText(text,tx,ty);ctx.textAlign="start"});
objects.forEach(o=>{const sc=mpp()||1,p0=pts[0],x=p0.x+o.x/100/sc,y=p0.y+o.y/100/sc;ctx.save();ctx.translate(x,y);ctx.strokeStyle="#6b21a8";ctx.fillStyle="rgba(107,33,168,.13)";ctx.lineWidth=2;let w=28,h=28;if(o.type==="Lichtkuppel"||o.type==="Kamin"){w=Math.max(24,(o.w||100)/100/sc);h=Math.max(24,(o.h||100)/100/sc)}if(o.type==="Lüfter"){let r=Math.max(12,(o.d||100)/200/100/sc);ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.stroke()}else{ctx.fillRect(-w/2,-h/2,w,h);ctx.strokeRect(-w/2,-h/2,w,h)}ctx.fillStyle="#4c1d95";ctx.font="bold 15px Arial";ctx.textAlign="center";ctx.fillText(o.type,0,-h/2-10);ctx.restore()})
if(tape.base>=0&&tape.target>=0){
 const a=E(tape.base),b=E(tape.target),A={x:(a.a.x+a.b.x)/2,y:(a.a.y+a.b.y)/2},B={x:(b.a.x+b.b.x)/2,y:(b.a.y+b.b.y)/2};
 const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,nx=-uy,ny=ux;
 ctx.strokeStyle="#0066cc";ctx.fillStyle="#0066cc";ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();ctx.setLineDash([]);
 const cm=Math.round(L*(mpp()||1)*100),mx=(A.x+B.x)/2,my=(A.y+B.y)/2;
 ctx.font="bold 20px Arial";ctx.textAlign="center";ctx.textBaseline="middle";const txt=`K${tape.base+1} → K${tape.target+1}: ${cm} cm`,tw=ctx.measureText(txt).width+16;
 ctx.fillStyle="rgba(255,255,255,.95)";ctx.fillRect(mx-tw/2,my-15,tw,30);ctx.fillStyle="#0066cc";ctx.fillText(txt,mx,my);
}
}ctx.restore()}function geometryOK(i){const a=angleAt(i);if(a==null)return false;return [45,60,90,120,135,180,270].some(t=>Math.abs(a-t)<0.6)}
function orthogonalize(){
 if(!closed||pts.length<3){status.textContent="Erst die Dachkontur schließen.";return}
 const scale=mpp()||1,old=pts.map(p=>({...p})),cand=[{...pts[0]}],dirs=[];
 for(let i=0;i<pts.length;i++){const e=E(i),a=Math.atan2(e.b.y-e.a.y,e.b.x-e.a.x);dirs.push(Math.round(a/(Math.PI/2))*(Math.PI/2))}
 for(let i=0;i<pts.length-1;i++){const e=E(i),v=num(measures[i]),len=(v>0?v:e.L*scale)/scale,a=dirs[i],p=cand[cand.length-1];cand.push({x:p.x+Math.cos(a)*len,y:p.y+Math.sin(a)*len})}
 const i=pts.length-1,e=E(i),v=num(measures[i]),len=(v>0?v:e.L*scale)/scale,a=dirs[i],p=cand[i];
 const end={x:p.x+Math.cos(a)*len,y:p.y+Math.sin(a)*len},err=Math.hypot(end.x-cand[0].x,end.y-cand[0].y);
 if(err>Math.max(3,6/view.s)){status.textContent="Maße lassen sich so nicht rechtwinklig schließen. Abweichende Winkel bleiben rot markiert.";draw();return}
 pts=cand;inferOrthogonalMeasures();status.textContent="Geometrie angepasst: Maße beibehalten, rechtwinklige Ecken ausgerichtet.";draw()
}
function add(p){p=snap(p);if(pts.length>=3&&dist(p,pts[0])<csspx(32)){closed=true;status.textContent="Kontur geschlossen – Kante direkt antippen.";draw();return}pts.push(p);status.textContent="P"+pts.length+" gesetzt.";draw()}
function openEdge(i){active=i;mtitle.textContent="K"+(i+1)+" – Länge in m";mlen.value=measures[i]||"";modal.classList.add("show");setTimeout(()=>mlen.focus(),60)}
function close(){modal.classList.remove("show");active=-1}
cv.addEventListener("pointerdown",e=>{
 e.preventDefault();
 const sp=screen(e);pointers.set(e.pointerId,sp);cv.setPointerCapture(e.pointerId);
 if(pointers.size===2){beginPinch();return}
 const p=world(e);
 if(placing&&closed){const sc=mpp()||1,p0=pts[0];placing.x=(p.x-p0.x)*sc*100;placing.y=(p.y-p0.y)*sc*100;objects.push(placing);placing=null;status.textContent="Bauteil gesetzt. Antippen für cm-genaue X/Y-Position.";draw();return}
 if(!closed){add(p);return}
 const oi=objectHit(p);if(oi>=0){openPosition(oi);return}
 const pi=pointHit(p);
 if(pi>=0){gesture={type:"corner",i:pi,mpp:mpp()};return}
 const ei=edgeHit(p);
 if(ei>=0){if(tapeEdge(ei))return;openEdge(ei);return}
 gesture={type:"pan",sx:sp.x,sy:sp.y,ox:view.ox,oy:view.oy}
});
cv.addEventListener("pointermove",e=>{
 if(!pointers.has(e.pointerId))return;
 e.preventDefault();const sp=screen(e);pointers.set(e.pointerId,sp);
 if(pointers.size===2){if(!pinch)beginPinch();updatePinch();return}
 if(!gesture)return;
 if(gesture.type==="corner"){
  const p=world(e),i=gesture.i;pts[i]=p;
  [(i-1+pts.length)%pts.length,i].forEach(k=>measures[k]=(E(k).L*gesture.mpp).toFixed(2).replace(".",","));
  draw();return
 }
 view.ox=gesture.ox+sp.x-gesture.sx;view.oy=gesture.oy+sp.y-gesture.sy;draw()
});
function pointerEnd(e){
 pointers.delete(e.pointerId);
 if(pointers.size<2)pinch=null;
 if(pointers.size===0){if(gesture&&gesture.type==="corner")inferOrthogonalMeasures();gesture=null;draw()}
}
cv.addEventListener("pointerup",pointerEnd);
cv.addEventListener("pointercancel",pointerEnd);
const attikaModal=document.getElementById("attikaModal"),objModal=document.getElementById("objModal"),posModal=document.getElementById("posModal"),objType=document.getElementById("objType"),objFields=document.getElementById("objFields");
function objectFields(){const t=objType.value;if(t==="Lichtkuppel"||t==="Kamin")objFields.innerHTML='<label>Länge (cm)</label><input id="ow" inputmode="decimal" value="100"><label>Breite (cm)</label><input id="oh" inputmode="decimal" value="100">';else if(t==="Lüfter")objFields.innerHTML='<label>Durchmesser (mm)</label><input id="od" inputmode="decimal" value="100">';else objFields.innerHTML=""}
objType.onchange=objectFields;objectFields();
document.getElementById("attikaBtn").onclick=()=>{attH.value=attika.h;attB.value=attika.b;attikaModal.classList.add("show")};
attCancel.onclick=()=>attikaModal.classList.remove("show");attSave.onclick=()=>{attika.h=num(attH.value)||30;attika.b=num(attB.value)||24;attikaModal.classList.remove("show");status.textContent=`Attika Standard: ${attika.h} cm hoch × ${attika.b} cm breit.`};
document.getElementById("objBtn").onclick=()=>{objectFields();objModal.classList.add("show")};objCancel.onclick=()=>objModal.classList.remove("show");
objPlace.onclick=()=>{if(!closed){status.textContent="Erst Dachkontur schließen.";return}const t=objType.value,o={type:t,x:0,y:0};if(t==="Lichtkuppel"||t==="Kamin"){o.w=num(ow.value)||100;o.h=num(oh.value)||100}if(t==="Lüfter")o.d=num(od.value)||100;placing=o;objModal.classList.remove("show");status.textContent=t+": Position auf der Dachfläche antippen."};
function objectHit(p){if(!closed)return-1;const sc=mpp()||1,p0=pts[0];for(let i=objects.length-1;i>=0;i--){const o=objects[i],x=p0.x+o.x/100/sc,y=p0.y+o.y/100/sc;if(Math.hypot(p.x-x,p.y-y)<32/view.s)return i}return-1}
function openPosition(i){editObj=i;const o=objects[i];posTitle.textContent=o.type+" – Position";posX.value=Math.round(o.x);posY.value=Math.round(o.y);posModal.classList.add("show")}
posCancel.onclick=()=>{editObj=-1;posModal.classList.remove("show")};posSave.onclick=()=>{if(editObj>=0){objects[editObj].x=num(posX.value)||0;objects[editObj].y=num(posY.value)||0}editObj=-1;posModal.classList.remove("show");draw()};
document.getElementById("measureBtn").onclick=()=>{tape.on=!tape.on;tape.base=-1;tape.target=-1;measureBtn.textContent=tape.on?"📏 Bezug wählen":"📏 Maßband";status.textContent=tape.on?"Feste Bezugskante antippen, z. B. K2.":"Maßband beendet.";draw()};
function tapeEdge(i){
 if(!tape.on)return false;
 if(tape.base<0){tape.base=i;measureBtn.textContent=`📏 K${i+1} fest`;status.textContent=`K${i+1} ist fester Bezug. Jetzt andere Kante antippen.`}
 else if(i!==tape.base){tape.target=i;status.textContent=`K${tape.base+1} bleibt fest. Ziel K${i+1}.`}
 draw();return true
}
document.getElementById("save").onclick=()=>{if(active<0)return;const i=active,v=mlen.value.trim();measures[i]=v;if(v){const j=mate(i);if(j>=0&&!measures[j])measures[j]=v;inferOrthogonalMeasures();rebuildFromMeasures(i);inferOrthogonalMeasures()}status.textContent=v?"K"+(i+1)+" = "+v.replace(".",",")+" m übernommen.":"Maß gelöscht.";close();draw()};

function zoom(f){const cx=cv.width/2,cy=cv.height/2,ns=Math.max(.3,Math.min(4,view.s*f));view.ox=cx-(cx-view.ox)*ns/view.s;view.oy=cy-(cy-view.oy)*ns/view.s;view.s=ns;draw()}document.getElementById("zin").onclick=()=>zoom(1.25);document.getElementById("zout").onclick=()=>zoom(.8);
